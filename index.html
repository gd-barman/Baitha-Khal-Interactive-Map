<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baitha Khal | Interactive study area</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#203341;background:#f5f7f9}header{padding:12px 18px;background:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:20px;margin:0}small{color:#50616d}button{cursor:pointer;padding:8px 12px;border:1px solid #b9c5ce;border-radius:7px;background:white;color:#203341}#map{height:calc(100dvh - 130px);min-height:300px}footer{padding:8px 18px;font-size:12px}dialog{border:1px solid #bbc8d0;border-radius:12px;width:min(850px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}.media{width:100%;max-height:420px;object-fit:contain;background:#edf1f3;border-radius:6px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.legend{background:#fff;padding:10px;border-radius:6px;line-height:1.65}.leaflet-tooltip{font-weight:600}.leaflet-popup-content{min-width:180px}</style></head><body><header><div><h1>Baitha Khal | Sylhet, Bangladesh</h1><small>Urban drainage and SWMM modelling domain · Field survey, 23 November 2026</small></div><button id="all">Field survey gallery</button><button id="mouth">River mouth evidence</button><button id="reset">Reset view</button><button id="full">Fullscreen</button></header><div id="map"></div><footer>Research visualization · Survey markers generalized for public display. Underlying datasets are not distributed through this site. Basemap attribution shown on map.</footer><dialog id="viewer"><form method="dialog"><button>Close</button></form><h2 id="heading"></h2><div id="content" class="gallery"></div></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const bounds=[[24.88397270266107, 91.85632741955429], [24.914120960518577, 91.8832841636844]], points=[{"id": "J0172", "kind": "OPEN", "lat": 24.902, "lon": 91.8697}, {"id": "OPEN_NEW_01", "kind": "OPEN", "lat": 24.8989, "lon": 91.8649}, {"id": "OPEN_NEW_02", "kind": "OPEN", "lat": 24.8954, "lon": 91.871}, {"id": "OPEN_NEW_03", "kind": "OPEN", "lat": 24.8953, "lon": 91.8626}, {"id": "OPEN_NEW_04", "kind": "OPEN", "lat": 24.8932, "lon": 91.8696}, {"id": "OPEN_NEW_05", "kind": "OPEN", "lat": 24.8908, "lon": 91.8655}, {"id": "OPEN_NEW_06", "kind": "OPEN", "lat": 24.8883, "lon": 91.8612}, {"id": "J0086", "kind": "COVERED", "lat": 24.8992, "lon": 91.8648}, {"id": "J0112", "kind": "COVERED", "lat": 24.8993, "lon": 91.8657}, {"id": "J0164", "kind": "COVERED", "lat": 24.9, "lon": 91.869}, {"id": "J0166", "kind": "COVERED", "lat": 24.9, "lon": 91.8691}, {"id": "COVERED_NEW_01", "kind": "COVERED", "lat": 24.9034, "lon": 91.875}, {"id": "COVERED_NEW_02", "kind": "COVERED", "lat": 24.8995, "lon": 91.8687}], gallery={"J0172": [{"url": "assets/J0172_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "OPEN_NEW_01": [{"url": "assets/OPEN_NEW_01_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "OPEN_NEW_02": [], "OPEN_NEW_03": [{"url": "assets/OPEN_NEW_03_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "OPEN_NEW_04": [], "OPEN_NEW_05": [], "OPEN_NEW_06": [{"url": "assets/OPEN_NEW_06_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}, {"url": "assets/OPEN_NEW_06_photo_02.jpg", "kind": "photo", "title": "Field photograph 2"}], "J0086": [{"url": "assets/J0086_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "J0112": [{"url": "assets/J0112_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "J0164": [], "J0166": [], "COVERED_NEW_01": [{"url": "assets/COVERED_NEW_01_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}], "COVERED_NEW_02": [{"url": "assets/COVERED_NEW_02_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}, {"url": "assets/COVERED_NEW_02_photo_02.jpg", "kind": "photo", "title": "Field photograph 2"}, {"url": "assets/COVERED_NEW_02_photo_03.jpg", "kind": "photo", "title": "Field photograph 3"}], "BAITHA_SURMA_MOUTH": [{"url": "assets/BAITHA_SURMA_MOUTH_photo_01.jpg", "kind": "photo", "title": "Field photograph 1"}]};
const map=L.map('map',{maxZoom:17}); const blank=L.layerGroup(); const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenStreetMap contributors'}); const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Imagery &copy; Esri and contributors'}); sat.addTo(map); map.fitBounds(bounds);
const layers={}; for(const [key,title] of [['context','Study area and river'],['inventory','Drainage inventory'],['network','SWMM network']]){layers[title]=L.imageOverlay('assets/'+key+'.png',bounds,{interactive:false});if(key!=='network')layers[title].addTo(map)}
const field=L.layerGroup().addTo(map);layers['Field survey locations']=field;
function show(ids,title){document.getElementById('heading').textContent=title;const c=document.getElementById('content');c.replaceChildren();for(const id of ids){for(const m of gallery[id]||[]){const box=document.createElement('section');const label=document.createElement('p');label.textContent=id.replaceAll('_',' ')+' — '+m.title;box.append(label);const el=document.createElement(m.kind==='video'?'video':'img');el.src=m.url;el.className='media';if(m.kind==='video'){el.controls=true;el.preload='metadata';}else{el.alt=label.textContent;el.loading='lazy';}box.append(el);c.append(box)}}if(!c.children.length)c.textContent='No media linked to this observation.';document.getElementById('viewer').showModal()}
for(const p of points){const open=p.kind==='OPEN', color=open?'#008b48':'#d77b19';const icon=L.divIcon({className:'',html:'<div style="width:13px;height:13px;background:'+color+';border:2px solid white;border-radius:'+(open?'50%':'1px')+'"></div>',iconSize:[13,13],iconAnchor:[6,6]});const m=L.marker([p.lat,p.lon],{icon}).addTo(field);m.bindTooltip(p.id,{direction:'top'});const box=document.createElement('div');const b=document.createElement('b');b.textContent=p.id+' — '+(open?'Open drainage':'Covered drainage');box.append(b);if((gallery[p.id]||[]).length){const btn=document.createElement('button');btn.textContent='View field photographs';btn.style.display='block';btn.style.marginTop='8px';btn.onclick=()=>show([p.id],p.id);box.append(btn)}m.bindPopup(box)}
L.control.layers({'Satellite imagery':sat,'OpenStreetMap':osm,'Plain background':blank},layers).addTo(map);L.control.scale({imperial:false}).addTo(map);const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Map legend</b><br>🟢 Open field observation<br>🟧 Covered field observation<br>Blue line — primary channel<br>Purple dashed — covered drain<br>Teal line — open drain<br>Gold outline — modelling domain';return d};legend.addTo(map);document.getElementById('all').onclick=()=>show(Object.keys(gallery),'Field survey gallery');document.getElementById('mouth').onclick=()=>show(['BAITHA_SURMA_MOUTH'],'Baitha Khal–Surma River connection');document.getElementById('reset').onclick=()=>map.fitBounds(bounds);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>map.invalidateSize());document.getElementById('viewer').addEventListener('close',()=>document.getElementById('content').replaceChildren());
</script></body></html>
